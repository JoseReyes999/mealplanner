# CI: runs on every push to a branch other than main and on every pull request.
# CD (cd.yml) also calls it on main, so a deploy only happens if these checks pass on that commit.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    name: Validate system.yaml and OpenAPI documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.39.0 openapi-spec-validator==0.9.0
      - name: system.yaml against system.schema.json
        run: check-jsonschema --schemafile system.schema.json system.yaml
      - name: Each openapi.yaml against the OpenAPI specification
        run: openapi-spec-validator services/recipes/openapi.yaml services/planner/openapi.yaml

  test:
    name: Lint and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [recipes, planner]
    env:
      # Password of the throwaway SQL Server below. It only exists inside this CI job
      # and never protects real data, so it is not a secret.
      SA_PASSWORD: CI-only-Passw0rd
    services:
      # The tests run against a real SQL Server, the same engine as Azure SQL.
      # CI never touches Azure SQL.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CI-only-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CI-only-Passw0rd -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 20s
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install
        run: pip install -r requirements.txt ruff==0.17.4
      - name: Lint
        run: ruff check .
      - name: Create the test databases (same db/init.sql as docker compose)
        run: |
          docker cp ../../db/init.sql ${{ job.services.mssql.id }}:/tmp/init.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/init.sql
      - name: Test with coverage (fails below 70%)
        env:
          TEST_DATABASE_URL: mssql://sa:${{ env.SA_PASSWORD }}@localhost:1433/${{ matrix.service }}_test
        run: python -m pytest -q --cov=. --cov-report=term-missing --cov-fail-under=70

  build:
    name: Build the ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [recipes, planner]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed; CD pushes on main)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          provenance: false