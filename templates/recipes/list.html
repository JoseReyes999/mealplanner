{% extends "base.html" %}
{% block title %}Recipes · MealPlanner{% endblock %}
{% block content %}
  <div class="actions">
    <h1>Recipes</h1>
    <a class="button" href="{{ url_for('recipes.create_view') }}">+ New recipe</a>
  </div>
  {% if recipes %}
    <table>
      <tr><th>Name</th><th>Servings</th></tr>
      {% for recipe in recipes %}
        <tr>
          <td><a href="{{ url_for('recipes.detail_view', recipe_id=recipe.id) }}">{{ recipe.name }}</a></td>
          <td>{{ recipe.base_servings }}</td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>No recipes yet.</p>
  {% endif %}
{% endblock %}
