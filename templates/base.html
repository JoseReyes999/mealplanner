<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MealPlanner{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; color: #222; }
    nav { display: flex; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid #ddd; margin-bottom: 20px; }
    nav a { text-decoration: none; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
    label { display: block; font-weight: 600; margin-top: 12px; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
    button, .button { margin-top: 12px; padding: 6px 14px; font: inherit; cursor: pointer; }
    .errors { background: #fdecea; border: 1px solid #f5c2c0; padding: 8px 12px; }
    .hint { color: #666; font-size: 0.9em; }
    .actions { display: flex; gap: 12px; align-items: center; }
    .pre { white-space: pre-line; }
    form.inline { display: inline; }
    button.small { margin: 0 0 0 4px; padding: 0 6px; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">MealPlanner</a>
    <a href="{{ url_for('recipes.list_view') }}">Recipes</a>
    <a href="{{ url_for('planner.list_view') }}">Meal plans</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
